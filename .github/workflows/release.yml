name: Microsoft Store and direct Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: windows-latest
    environment: release
    outputs:
      version: ${{ steps.contract.outputs.version }}
      repository: ${{ steps.contract.outputs.repository }}
      exe_name: ${{ steps.contract.outputs.exe_name }}
      msi_name: ${{ steps.contract.outputs.msi_name }}
      checksum_name: ${{ steps.contract.outputs.checksum_name }}
    steps:
      - name: Check out Desktop tag
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read pinned Web lock
        id: lock
        shell: powershell
        run: node scripts/release-contract.mjs lock-info --github-output $env:GITHUB_OUTPUT
      - name: Check out exact canonical Web commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.web_commit }}
          token: ${{ secrets.RELEASES_TOKEN }}
          path: _canonical-web
          fetch-depth: 1
          persist-credentials: false
      - name: Validate candidate, versions, manifest hash, and source registries
        id: contract
        shell: powershell
        run: >-
          node scripts/release-contract.mjs validate-candidate
          --web-root _canonical-web
          --tag "${{ github.ref_name }}"
          --github-output $env:GITHUB_OUTPUT
      - name: Stage exact pinned Web metadata
        shell: powershell
        run: >-
          node scripts/release-contract.mjs stage-metadata
          --web-root _canonical-web
          --version "${{ steps.contract.outputs.version }}"
          --output release-metadata
      - name: Upload pinned release contract
        uses: actions/upload-artifact@v4
        with:
          name: vibelink-release-contract-${{ github.run_id }}
          path: release-metadata
          if-no-files-found: error
          retention-days: 30

  package-store:
    needs: release-contract
    runs-on: windows-latest
    environment: release
    env:
      VIBELINK_LICENSE_API_URL: https://vibelink.moobang.net
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Check out Desktop tag
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Download pinned Web metadata
        uses: actions/download-artifact@v4
        with:
          name: vibelink-release-contract-${{ github.run_id }}
          path: release-metadata
      - name: Validate Store identity and distinct signing labels
        run: node scripts/release-contract.mjs validate-store-settings --metadata-root release-metadata
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Store submission MSIX
        shell: powershell
        run: |
          .\scripts\build-store-msix.ps1 `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - name: Verify exact Store package
        env:
          RELEASE_VERSION: ${{ needs.release-contract.outputs.version }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = $env:RELEASE_VERSION.Split('.')
          $storeVersion = "$(1 + [int]$parts[0]).$($parts[1]).$($parts[2]).0"
          $expected = "VibeLink_$($storeVersion)_x64.msix"
          $packages = @(Get-ChildItem src-tauri/target/store -Filter '*.msix' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -ne $expected) {
            throw "Expected exactly $expected; found: $($packages.Name -join ', ')"
          }
      - name: Upload Store package with pinned listing metadata
        uses: actions/upload-artifact@v4
        with:
          name: vibelink-microsoft-store-${{ github.ref_name }}
          path: |
            src-tauri/target/store/*.msix
            release-metadata/store-listing.json
            release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish-installers:
    needs: release-contract
    runs-on: windows-latest
    environment: release
    env:
      VIBELINK_LICENSE_API_URL: https://vibelink.moobang.net
      RELEASE_VERSION: ${{ needs.release-contract.outputs.version }}
      RELEASE_REPOSITORY: ${{ needs.release-contract.outputs.repository }}
      EXE_NAME: ${{ needs.release-contract.outputs.exe_name }}
      MSI_NAME: ${{ needs.release-contract.outputs.msi_name }}
      CHECKSUM_NAME: ${{ needs.release-contract.outputs.checksum_name }}
    steps:
      - name: Check out Desktop tag
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Download pinned Web metadata
        uses: actions/download-artifact@v4
        with:
          name: vibelink-release-contract-${{ github.run_id }}
          path: release-metadata
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build direct Windows installers
        run: pnpm tauri:build:ci
      - name: Verify exact installers and write checksum asset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path 'src-tauri/target/release/bundle/msi' $env:MSI_NAME
          $exe = Join-Path 'src-tauri/target/release/bundle/nsis' $env:EXE_NAME
          if (-not (Test-Path -LiteralPath $msi) -or -not (Test-Path -LiteralPath $exe)) {
            $found = Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Expected manifest-derived installer files were not found. Found:`n$($found -join "`n")"
          }
          $lines = @(
            "$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower())  $env:EXE_NAME"
            "$((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLower())  $env:MSI_NAME"
          )
          [System.IO.File]::WriteAllLines($env:CHECKSUM_NAME, $lines, [System.Text.Encoding]::ASCII)
      - name: Publish manifest-derived direct release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path 'src-tauri/target/release/bundle/nsis' $env:EXE_NAME
          $msi = Join-Path 'src-tauri/target/release/bundle/msi' $env:MSI_NAME
          gh release create "v$env:RELEASE_VERSION" `
            $exe `
            $msi `
            $env:CHECKSUM_NAME `
            --repo $env:RELEASE_REPOSITORY `
            --title "VibeLink $env:RELEASE_VERSION" `
            --notes-file release-metadata/direct-release-notes.md
      - name: Verify public release assets and checksum manifest
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >-
          node scripts/release-contract.mjs validate-public-release
          --manifest release-metadata/vibelink-product.v1.json
          --version "${{ needs.release-contract.outputs.version }}"
          --token-env RELEASES_TOKEN
          --retries 12
          --delay-ms 5000
