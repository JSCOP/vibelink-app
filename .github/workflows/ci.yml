name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a feature branch be checked before it becomes a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality ratchet self-test
        run: node scripts/check-quality-ratchets.mjs self-test
      - name: Source line ratchet
        run: node scripts/check-quality-ratchets.mjs source
      - name: Release contract tests
        run: pnpm test:release-contract
      - name: Frontend tests
        run: pnpm exec vitest run
      - name: Lint
        run: pnpm lint
      - name: Frontend build
        run: pnpm exec tsc -b && pnpm exec vite build --manifest
      - name: Bundle ratchet
        run: node scripts/check-quality-ratchets.mjs bundle
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Rust build
        working-directory: src-tauri
        run: cargo build

  # Compile-only gate for the platform seams. The product still ships Windows-only; this job
  # exists so a Windows-specific type or an ungated PowerShell call cannot reach main unnoticed.
  # Native runners, not cross-compilation: `cargo check` runs build scripts, and glib-sys /
  # webkit2gtk-sys resolve through pkg-config against real system packages.
  desktop-unix:
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the glibc and WebKitGTK floor a future Linux build would ship against, so the
        # CI floor and the ship floor stay the same value.
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev \
            libpipewire-0.3-dev libclang-dev libxcb1-dev libxrandr-dev
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets
