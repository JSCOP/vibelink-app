[package]
name = "vibelink-remote-v2-harness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
interprocess = "2"
keyring = { version = "3", features = ["windows-native"] }
local-ip-address = "0.6"
rand = "0.8"
rcgen = "0.13"
rmp-serde = "1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
snow = "0.9.6"
sysinfo = "0.33"
thiserror = "1"
time = "0.3"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
