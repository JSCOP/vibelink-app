[package]
name = "app"
version = "0.6.0"
description = "Agentic workspace terminal for Windows"
authors = ["JSCOP"]
license = "GPL-3.0-only"
repository = "https://github.com/JSCOP/vibelink-app"
edition = "2021"
rust-version = "1.85"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vibelink"
path = "vibelink-cli/main.rs"

[[bin]]
name = "vibelink-computer-host"
path = "src/computer_use/bin/vibelink-computer-host.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
url = "2"

[dependencies]
tauri = { version = "=2.11.3", features = ["unstable", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1"
serde_bytes = "0.11"
portable-pty = "0.9"
interprocess = "2"
directories = "6"
xcap = "0.9.6"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = { version = "2", features = ["serde"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
sysinfo = "0.33"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
local-ip-address = "0.6"
time = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
snow = "0.9.6"
zeroize = { version = "1", features = ["derive"] }
url = "2"

ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17.0"
trash = "5"

zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Release binary: thin LTO + single codegen unit measurably shrink and speed the 694-crate build output; strip removes symbols from the shipped exe.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
