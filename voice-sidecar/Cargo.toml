[package]
name = "vibelink-voice-sidecar"
version = "0.1.0"
edition = "2021"
description = "VibeLink local voice-to-text sidecar"

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "1"
audioadapter-buffers = "3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
futures-util = "0.3"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rubato = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", default-features = false, features = ["raw-api"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
] }
